<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOEIC Part 5 Part 6 トレーニング</title>
<style>
:root {
  --bg: #f4f7fc;
  --card: #ffffff;
  --ink: #1a2233;
  --sub: #526075;
  --line: #cbd5e1;
  --main: #1d4ed8;
  --main-hover: #1e40af;
  --ok: #059669;
  --okbg: #ecfdf5;
  --ng: #dc2626;
  --ngbg: #fef2f2;
  --timer: #d97706;
  --shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --ink: #f8fafc;
    --sub: #94a3b8;
    --line: #334155;
    --main: #3b82f6;
    --main-hover: #60a5fa;
    --ok: #10b981;
    --okbg: #064e3b;
    --ng: #ef4444;
    --ngbg: #451a1a;
    --timer: #f59e0b;
    --shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
  }
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Hiragino Sans", "Yu Gothic", sans-serif;
  line-height: 1.6;
  -webkit-tap-highlight-color: transparent;
}

main {
  max-width: 680px;
  margin: 0 auto;
  padding: 16px 12px 32px;
}

h1 {
  font-size: 1.4rem;
  font-weight: 800;
  text-align: center;
  margin: 12px 0 18px;
  color: var(--main);
  letter-spacing: 0.03em;
}

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 24px 20px;
  box-shadow: var(--shadow);
}

/* タイマー設定ボックス */
.timer-setting {
  margin-bottom: 20px;
  padding: 16px;
  background: rgba(29, 78, 216, 0.04);
  border: 2px solid var(--line);
  border-radius: 16px;
}

.timer-setting p {
  margin: 0 0 10px;
  font-weight: 700;
  font-size: 1rem;
  color: var(--ink);
}

.timer-opts {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

.t-btn {
  padding: 10px 4px;
  font-size: 0.95rem;
  font-weight: 700;
  background: var(--card);
  color: var(--ink);
  border: 2px solid var(--line);
  border-radius: 10px;
  text-align: center;
}

.t-btn.active {
  border-color: var(--main);
  background: var(--main);
  color: #ffffff;
}

/* タイマーバッジ */
.timer-badge {
  font-size: 1rem;
  font-weight: 800;
  color: var(--timer);
  background: rgba(217, 119, 6, 0.1);
  padding: 6px 14px;
  border-radius: 20px;
  border: 1px solid var(--timer);
}

.timer-badge.warn {
  color: var(--ng);
  border-color: var(--ng);
  background: var(--ngbg);
  animation: pulse 0.5s infinite alternate;
}

@keyframes pulse {
  from { opacity: 1; }
  to { opacity: 0.5; }
}

/* プログレスバー */
.bar {
  height: 10px;
  background: var(--line);
  border-radius: 5px;
  overflow: hidden;
  margin-bottom: 12px;
}
.bar i {
  display: block;
  height: 100%;
  width: 0;
  background: var(--main);
  border-radius: 5px;
  transition: width 0.3s ease;
}

.meta {
  color: var(--sub);
  font-size: 0.95rem;
  font-weight: 600;
  margin-bottom: 14px;
}

.q {
  font-size: 1.3rem;
  font-weight: 700;
  line-height: 1.5;
  margin: 10px 0 20px;
}

.word {
  display: block;
  font-size: 2.2rem;
  font-weight: 800;
  color: var(--main);
  letter-spacing: 0.04em;
  margin-top: 8px;
  word-break: break-all;
}

/* 選択肢ボタン */
.opts {
  display: grid;
  gap: 12px;
}
.opts.two { grid-template-columns: 1fr 1fr; }
.three { grid-template-columns: repeat(3, 1fr); }

button {
  font: inherit;
  cursor: pointer;
  transition: all 0.15s ease;
}

.opt {
  min-height: 60px;
  padding: 14px 18px;
  font-size: 1.1rem;
  font-weight: 600;
  text-align: left;
  background: var(--card);
  color: var(--ink);
  border: 2px solid var(--line);
  border-radius: 14px;
  display: flex;
  align-items: center;
}

.opt:hover:enabled {
  border-color: var(--main);
  background: rgba(29, 78, 216, 0.04);
}

.opt:active:enabled { transform: scale(0.98); }

.opt.ok {
  border-color: var(--ok) !important;
  background: var(--okbg) !important;
  color: var(--ink);
  font-weight: 700;
}

.opt.ng {
  border-color: var(--ng) !important;
  background: var(--ngbg) !important;
  color: var(--ink);
}

.opt:disabled { cursor: default; }

/* メニュー・モード選択ボタン */
.menu {
  display: grid;
  gap: 14px;
  margin-top: 16px;
}

.mode {
  width: 100%;
  min-height: 84px;
  padding: 16px 20px;
  text-align: left;
  font-size: 1.15rem;
  color: var(--ink);
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: 16px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.02);
}

.mode:hover {
  border-color: var(--main);
  transform: translateY(-2px);
  box-shadow: 0 6px 16px rgba(0,0,0,0.08);
}

.mode:active { transform: scale(0.99); }

.mode b {
  display: block;
  font-size: 1.2rem;
  margin-bottom: 4px;
  color: var(--main);
}

.mode span {
  display: block;
  font-size: 0.92rem;
  font-weight: 500;
  color: var(--sub);
}

/* 解説ボックス */
.res {
  margin-top: 20px;
  padding: 18px;
  border-radius: 14px;
  font-size: 1.02rem;
  line-height: 1.7;
}

.res.ok {
  background: var(--okbg);
  border: 2px solid var(--ok);
}

.res.ng {
  background: var(--ngbg);
  border: 2px solid var(--ng);
}

.res .head {
  font-size: 1.3rem;
  font-weight: 800;
  margin-bottom: 8px;
}

.res p { margin: 8px 0; }
.en {
  display: inline-block;
  font-style: italic;
  font-weight: 600;
  margin-top: 2px;
}

/* メインボタン */
.main {
  width: 100%;
  min-height: 60px;
  margin-top: 20px;
  padding: 14px;
  font-size: 1.2rem;
  font-weight: 800;
  color: #ffffff;
  background: var(--main);
  border: 0;
  border-radius: 14px;
  box-shadow: 0 4px 12px rgba(29, 78, 216, 0.3);
}

.main:hover { background: var(--main-hover); }
.main:active { transform: scale(0.98); }

/* ユーティリティ */
.hide { display: none !important; }

.score {
  font-size: 3.2rem;
  font-weight: 900;
  text-align: center;
  color: var(--main);
  margin: 12px 0 4px;
}

.pct {
  text-align: center;
  font-size: 1.3rem;
  font-weight: 700;
  color: var(--sub);
  margin: 0 0 6px;
}

.avg-time {
  text-align: center;
  font-size: 1.1rem;
  font-weight: 800;
  color: var(--timer);
  margin: 0 0 16px;
}

.list {
  padding-left: 1.2em;
  font-size: 1rem;
  line-height: 1.8;
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-bottom: 14px;
}

.ghost {
  min-height: 46px;
  padding: 8px 16px;
  font-size: 1rem;
  font-weight: 700;
  color: var(--sub);
  background: transparent;
  border: 2px solid var(--line);
  border-radius: 12px;
}

.ghost:hover {
  border-color: var(--sub);
  color: var(--ink);
}

#acc {
  font-size: 0.98rem;
  font-weight: 700;
  color: var(--main);
}

:focus-visible {
  outline: 3px solid var(--main);
  outline-offset: 3px;
}
.opt.sel { border-color: var(--main); background: rgba(29, 78, 216, 0.1); }
.fcard { min-height: 280px; padding: 24px 18px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; background: var(--card); border: 2px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); cursor: pointer; user-select: none; }
.fcard.flip { animation: flip .25s ease; }
@keyframes flip { from { transform: rotateY(90deg); opacity: .4; } to { transform: none; opacity: 1; } }
.fc-word { font-size: 2.4rem; font-weight: 800; color: var(--main); word-break: break-all; }
.fc-hint, .fc-small { color: var(--sub); font-size: .95rem; margin-top: 10px; }
.fc-pos, .fc-mean { font-size: 1.6rem; font-weight: 800; color: var(--ok); margin: 6px 0; }
.fc-text { text-align: left; font-size: 1rem; line-height: 1.7; }
.fc-text p { margin: 6px 0; }
.fc-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
.fc-btns .opt { justify-content: center; font-weight: 800; }
.passage{position:sticky;top:0;z-index:5;max-height:38vh;overflow-y:auto;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px;line-height:1.95;font-size:1.02rem;box-shadow:var(--shadow)}
.ptitle{font-weight:800;color:var(--main);margin-bottom:8px}
.blank{display:inline-block;padding:0 6px;border-radius:6px;border:2px dashed var(--line);font-weight:800;cursor:pointer}
.blank.done{border-color:var(--ok);color:var(--ok)}
.blank.cur{background:var(--main);border:2px solid var(--main);color:#fff}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.nav .ghost:disabled{opacity:.35;cursor:default}
.mode.sel{border-color:var(--main);background:rgba(29,78,216,.07)}
.rv h3{font-size:1.1rem;margin:26px 0 8px;color:var(--main)}
.rbox{padding:12px;border:1px solid var(--line);border-radius:12px;margin:8px 0;line-height:1.9;font-size:.98rem}
.fill{background:var(--okbg);color:var(--ok);padding:0 4px;border-radius:4px}
.rq{margin:10px 0;padding:12px;border-radius:12px;font-size:.98rem;line-height:1.7}
.rq.ok{background:var(--okbg);border-left:6px solid var(--ok)}
.rq.ng{background:var(--ngbg);border-left:6px solid var(--ng)}

</style>
</head>
<body>
<main>
  <h1>TOEIC Part 6 トレーニング</h1>
  <div id="home" class="card">
    <div class="timer-setting">
      <p>⏱️ 1文章あたりの制限時間</p>
      <div class="timer-opts">
        <button class="t-btn" data-t="120">2分</button>
        <button class="t-btn" data-t="150">2分30秒</button>
        <button class="t-btn" data-t="180">3分</button>
        <button class="t-btn active" data-t="0">なし</button>
      </div>
    </div>
    <p style="margin:0;font-size:1.1rem;font-weight:700;text-align:center">モードを選択してください</p>
    <div class="menu">
      <button class="mode sel" data-mode="single"><b>1文章集中モード</b><span>ランダムで1文章(4問)を解く</span></button>
      <button class="mode" data-mode="mock"><b>Part 6 総合模試モード</b><span id="mockDesc"></span></button>
    </div>
    <button id="start" class="main">スタート</button>
  </div>
  <div id="quiz" class="card hide">
    <div class="top"><button id="back" class="ghost">← トップへ</button><span id="timerBadge" class="timer-badge hide"></span></div>
    <div class="meta" id="pLabel"></div>
    <div class="passage"><div class="ptitle" id="pTitle"></div><div id="passage"></div></div>
    <div class="meta" id="qLabel" style="margin-top:14px"></div>
    <div class="opts" id="options"></div>
    <div class="nav"><button id="prev" class="ghost">← 前へ</button><button id="nxt" class="ghost">次へ →</button></div>
    <button id="fin" class="main hide"></button>
  </div>
  <div id="end" class="card hide">
    <div class="meta" style="text-align:center;font-size:1.2rem">― 結果 ―</div>
    <div class="score" id="score"></div>
    <p class="pct" id="pct"></p>
    <p class="avg-time" id="tm"></p>
    <div id="review"></div>
    <button id="retry" class="main">もう一度挑戦する</button>
    <button id="toHome" class="main" style="background:transparent;color:var(--main);border:2px solid var(--main);box-shadow:none">トップに戻る</button>
  </div>
</main>
<script src="quiz.js?v=1"></script>
</body>
</html>
